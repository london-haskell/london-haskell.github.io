<div id="events">
    <h2>Events</h2>
    <ul>
     $for(events)$
        <li>
            $date$ @ 
                $if(location-page)$
                    <a href="$location-page$">$location$</a>
                $else$
                    $location$
                $endif$
            <ul>
                <li><a href="$url$">Introductory Slides</a></li>
                <li><a href="$event-page$">Event Page</a></li>
            </ul>
        </li>
     $endfor$
    </ul>
</div>
